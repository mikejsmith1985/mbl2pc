# Cloudflare Worker for mbl2pc — scheduled Supabase heartbeat + custom domain.
name = "mbl2pc"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ── Scheduled heartbeat ────────────────────────────────────────────────────────
# Every 6 hours. Supabase pauses a free project after 7 days without database
# activity, so this has a very wide margin — even several missed runs are safe.
[triggers]
crons = ["0 */6 * * *"]

# ── Custom domain ──────────────────────────────────────────────────────────────
# Cloudflare provisions the DNS record and certificate for this hostname. The
# apex (rootlevellabs.tech) is untouched — this Worker only answers the subdomain.
routes = [
  { pattern = "mbl2pc.rootlevellabs.tech", custom_domain = true }
]

[vars]
# The FastAPI origin this Worker pings and proxies to. Derived from the service
# name in render.yaml — confirm it against the Render dashboard before deploying.
ORIGIN_BASE_URL = "https://mbl2pc-fastapi.onrender.com"
